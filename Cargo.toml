[package]
name = "game-of-life"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", features = ["winit"] }
env_logger = "0.11.11"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
log = "0.4.35"
pollster = "1.0.1"
rand = "0.10.3"
wgpu = "30.0.2"
winit = { version = "0.30.13", features = ["android-native-activity"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.37.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.37", default-features = false }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
wgpu = { version = "30.0.1", features = ["webgl"]}
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "Document",
    "Window",
    "Element",
]}
